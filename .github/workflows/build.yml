name: Clean Cache

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete all caches
        run: |
          echo "Fetching cache list..."
          CACHES=$(gh cache list --limit 100 --json id --jq '.[].id')
          
          if [ -z "$CACHES" ]; then
            echo "No caches found to delete"
          else
            echo "Found caches to delete:"
            echo "$CACHES"
            echo ""
            for CACHE_ID in $CACHES; do
              echo "Deleting cache $CACHE_ID..."
              gh cache delete $CACHE_ID
            done
            echo ""
            echo "All caches deleted successfully!"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify caches cleared
        run: |
          echo "Verifying no caches remain..."
          REMAINING=$(gh cache list --limit 1 --json id --jq '.[].id')
          if [ -z "$REMAINING" ]; then
            echo "✅ All caches successfully cleared!"
          else
            echo "⚠️ Some caches still remain"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
