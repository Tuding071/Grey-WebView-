name: Build Grey Browser

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Browser.kt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Browser.kt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK path
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate project structure
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          PKG=app/src/main/java/com/grey/browser
          mkdir -p $PKG
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          cp Browser.kt $PKG/

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Grey"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")             version "8.9.1" apply false
              id("org.jetbrains.kotlin.android")        version "2.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.0" apply false
          }
          EOF

          cat > app/build.gradle.kts << EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace  = "com.grey.browser"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.grey.browser"
                  minSdk        = 26
                  targetSdk     = 36
                  versionCode   = ${BUILD_NUMBER}
                  versionName   = "${BUILD_NUMBER}"
              }

              signingConfigs {
                  create("release") {
                      storeFile     = file("dummy.keystore")
                      storePassword = "password"
                      keyAlias      = "dummy"
                      keyPassword   = "password"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig  = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }

              splits {
                  abi {
                      isEnable       = true
                      reset()
                      include("arm64-v8a")
                      isUniversalApk = false
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.0")

              val bom = platform("androidx.compose:compose-bom:2025.05.00")
              implementation(bom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.animation:animation")
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
          kotlin.code.style=official
          android.suppressUnsupportedCompileSdk=36
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Grey</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#121212</item>
                  <item name="android:statusBarColor">#121212</item>
                  <item name="android:navigationBarColor">#121212</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Generate dummy keystore
        run: |
          keytool -genkey -v \
            -keystore app/dummy.keystore \
            -alias dummy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password \
            -keypass password \
            -dname "CN=Dummy, OU=Grey, O=Grey Browser, L=Test, S=Test, C=US"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-pillow-v2

      - name: Generate launcher icons (fresh)
        run: |
          # Clean any existing icons first
          rm -rf app/src/main/res/mipmap-*
          
          pip install Pillow --quiet
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os

          def make_icon(size):
              # Deep dark grey background matching the app theme
              BG = (18, 18, 18, 255)
              # Pure white for the browser icon
              WHITE = (255, 255, 255, 255)
              # Light grey for subtle details
              LIGHT_GREY = (200, 200, 200, 255)

              img = Image.new('RGBA', (size, size), BG)
              d = ImageDraw.Draw(img)

              # Modern minimalist browser icon
              padding = size // 5
              stroke_width = max(2, size // 16)
              center = size // 2
              
              # Outer rounded square (browser window)
              radius = (size - 2 * padding) // 2
              d.rounded_rectangle(
                  [padding, padding, size - padding, size - padding],
                  radius=size // 8,
                  outline=WHITE,
                  width=stroke_width
              )

              # URL/search bar at top
              bar_height = size // 8
              bar_padding = padding + size // 10
              d.rounded_rectangle(
                  [bar_padding, padding + size // 8, size - bar_padding, padding + size // 8 + bar_height],
                  radius=size // 16,
                  fill=LIGHT_GREY
              )

              # Content area lines
              line_width = size // 14
              line_margin = padding + size // 6
              
              # Content line 1
              d.rounded_rectangle(
                  [line_margin, padding + size // 3, size - line_margin * 2, padding + size // 3 + line_width // 2],
                  radius=size // 32,
                  fill=LIGHT_GREY
              )
              
              # Content line 2 (shorter)
              d.rounded_rectangle(
                  [line_margin, padding + size // 2, size - line_margin * 3, padding + size // 2 + line_width // 2],
                  radius=size // 32,
                  fill=LIGHT_GREY
              )

              return img

          # Generate icons for all densities
          sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192
          }
          
          for density, s in sizes.items():
              path = f'app/src/main/res/mipmap-{density}'
              os.makedirs(path, exist_ok=True)
              
              icon = make_icon(s)
              icon.save(f'{path}/ic_launcher.png')
              icon.save(f'{path}/ic_launcher_round.png')
              
              print(f"✅ Generated {density} icons ({s}x{s})")

          # Create adaptive icon XML for API 26+
          os.makedirs('app/src/main/res/mipmap-anydpi-v26', exist_ok=True)
          
          with open('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml', 'w') as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''')
          
          with open('app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml', 'w') as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''')
          
          # Create color resource for adaptive icon background
          os.makedirs('app/src/main/res/values', exist_ok=True)
          with open('app/src/main/res/values/ic_launcher_background.xml', 'w') as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#121212</color>
          </resources>''')

          print("🎨 Adaptive icons configured!")
          print("📱 Icon design: Modern browser window with address bar")
          PYEOF

      - name: Verify icons exist
        run: |
          echo "Checking generated icons..."
          find app/src/main/res/mipmap-* -name "*.png" -o -name "*.xml" | sort
          echo "✅ All icon files present"

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version=8.11.1 --distribution-type=bin
          chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK contents
        run: |
          echo "Checking APK for icons..."
          unzip -l app/build/outputs/apk/release/app-arm64-v8a-release.apk | grep -E "mipmap|ic_launcher"
          
      - name: Verify APK signing
        run: |
          APK_PATH="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          if [ -f "$APK_PATH" ]; then
              echo "✅ Release APK generated"
              echo "📦 APK size: $(ls -lh "$APK_PATH" | awk '{print $5}')"
              $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK_PATH"
          else
              echo "❌ Release APK not found"
              exit 1
          fi

      - name: Bundle release
        run: |
          mkdir -p Grey-release/.github/workflows
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk Grey-release/Grey.apk
          cp Browser.kt Grey-release/
          cp .github/workflows/build.yml Grey-release/.github/workflows/

          APK_SIZE=$(ls -lh app/build/outputs/apk/release/app-arm64-v8a-release.apk | awk '{print $5}')

          cat > Grey-release/BUILD_INFO.txt << EOF
          Build:      #${{ github.run_number }}
          Commit:     ${{ github.sha }}
          Timestamp:  $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Signed:     Yes (dummy keys)
          APK Size:   $APK_SIZE
          Optimized:  No (ProGuard/R8 disabled)
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grey-${{ github.run_number }}
          path: Grey-release/
          retention-days: 30
